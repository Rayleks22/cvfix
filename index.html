<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#205b4c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://cvfix.com.ng/" />
    <title>CVFix — A better CV for your next opportunity</title>
    <meta
      name="description"
      content="Free, practical CV feedback for Nigerian jobseekers. Improve your wording without invented achievements, compare a job description, and get editable Word and PDF documents."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cvfix.com.ng/" />
    <meta property="og:title" content="CVFix — Good experience · A better CV" />
    <meta
      property="og:description"
      content="Clear feedback. Stronger wording. Still your story. Start with a free CV review, built for Nigerian jobseekers."
    />
    <meta property="og:image" content="https://cvfix.com.ng/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="CVFix: Good experience · A better CV. Free CV feedback for Nigerian jobseekers."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CVFix — Good experience · A better CV" />
    <meta
      name="twitter:description"
      content="Clear feedback. Stronger wording. Still your story."
    />
    <meta name="twitter:image" content="https://cvfix.com.ng/og-card.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "CVFix",
        "url": "https://cvfix.com.ng/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web browser",
        "description": "A rule-based CV text review and optional editable document package for Nigerian jobseekers.",
        "offers": [
          { "@type": "Offer", "name": "Free CV review", "price": "0", "priceCurrency": "NGN" },
          {
            "@type": "Offer",
            "name": "Full CV package",
            "price": "1000",
            "priceCurrency": "NGN",
            "url": "https://cvfix.com.ng/pricing"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >CVFix needs JavaScript to review your CV in your browser. Enable JavaScript to use the free
      reviewer. Your CV is not uploaded for a free review.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
