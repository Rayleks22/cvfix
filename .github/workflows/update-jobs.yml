name: Refresh Remotive source listings
on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update source snapshot
        run: node scripts/fetch-remote-jobs.js
      - name: Commit changed source data
        run: |
          git config user.name "CVFix Source Sync Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/mockJobs.ts
          if ! git diff --staged --quiet; then
            git commit -m "chore(jobs): refresh source snapshot without inferred claims [skip ci]"
            git push
          fi
